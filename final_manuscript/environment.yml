# conda env for reviewer replication of scJDO manuscript v54.
# Tested: macOS 25.5.0, Python 3.13.2, 2026-07-24.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate scjdo-review
#   pip install -e <path-to-scJDO-repo>    # installs scjdo v0.3.0
#
# Notes:
# - PyTorch is CPU by default; add cudatoolkit or an mps-enabled build if you have GPU/MPS.
# - splicejac and dynamo-release are Fig 4-only; they can be omitted if you
#   only need Fig 2/3/5/6.
# - scvelo will auto-download the Setty CD34+ dataset on first Fig 4 run.
# - decoupler is used for regulator scoring; note that decoupler 2.x removes
#   the get_collectri() loader — pin to 1.x or accept a silent fallback (see
#   memory/decoupler-2x-breaks-collectri-loader.md in the repo).

name: scjdo-review
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10                    # 3.9–3.13 all work; 3.10 for widest package availability
  - pip
  - numpy>=1.23
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.3
  - h5py>=3.10
  - numba>=0.58
  - tqdm>=4.66
  - jupyterlab>=4.0
  - ipykernel>=6.25
  - nbconvert>=7.0
  - pillow
  - pip:
      # Core single-cell stack
      - anndata>=0.10
      - scanpy>=1.9
      - scvelo>=0.3                # auto-downloads Setty CD34+
      - cellrank>=2.0
      # scJDO's own runtime deps
      - torch>=2.2
      # Trajectory tooling used by Fig 3
      - palantir>=1.4
      # Fig 4 concordance — other Jacobian methods
      - dynamo-release>=1.4
      - splicejac                  # pip name: splicejac
      # Regulator scoring (Fig 3 / Fig 5 / Fig 6)
      - decoupler==1.6.0           # pin to 1.x — 2.x removes get_collectri()
      # Fig 2c/2d — additional embedding methods
      - scvi-tools>=1.0
      # Optional: scjdo — install from the parent repo via pip install -e ..
      # - -e ..
